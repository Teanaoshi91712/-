<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人生を変える6ヶ月の地図</title>
  <style>
    :root {
      --primary: #2A6F7A;
      --primary-light: #7FCBD6;
      --bg: #F9F9F6;
      --bg-panel: #FFFFFF;
      --text: #2A2620;
      --text-muted: #5B564C;
      --border: #E0E0D8;
      --accent: #F17A3C;
    }
    body {
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }
    header {
      text-align: center;
      padding: 40px 0 20px;
    }
    h1 {
      color: var(--primary);
      margin: 0 0 10px;
      font-size: 24px;
    }
    .lead {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 30px;
    }
    .month-card {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .month-header {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }
    .month-number {
      background: var(--primary);
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      margin-right: 15px;
    }
    .month-title {
      font-size: 18px;
      font-weight: bold;
      color: var(--primary);
    }
    .month-desc {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 15px;
    }
    textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 100px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-family: inherit;
      font-size: 14px;
      resize: vertical;
      margin-bottom: 10px;
    }
    textarea:focus {
      outline: none;
      border-color: var(--primary-light);
      box-shadow: 0 0 0 2px rgba(42, 111, 122, 0.2);
    }
    .save-status {
      font-size: 12px;
      color: var(--accent);
      text-align: right;
      min-height: 18px;
    }
    .video-link {
      display: block;
      text-align: center;
      margin-top: 30px;
      color: var(--primary);
      text-decoration: none;
      font-size: 14px;
    }
    .video-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>人生を変える6ヶ月の地図</h1>
    <p class="lead">半年で別人に。837万回見られた「人生を変える」ためのステップを記録しよう。</p>
  </header>

  <div id="app"></div>

  <a href="https://youtu.be/slWKtxJ_Ouo?si=XkKHt3gZM-HyUWaD" target="_blank" class="video-link">元の動画を見る (YouTube)</a>
</div>

<script>
  const months = [
    { num: 1, title: "描く (Draw)", desc: "1ヶ月目: 理想の未来や目標を具体的に紙に書き出し、鮮明に描く。" },
    { num: 2, title: "消す (Erase)", desc: "2ヶ月目: 目標達成の邪魔になる習慣や物事、人間関係を断ち切る・やめる。" },
    { num: 3, title: "入れる (Insert)", desc: "3ヶ月目: 空いた時間と空間に、新しい良い習慣や知識を取り入れる。" },
    { num: 4, title: "測る (Measure)", desc: "4ヶ月目: これまでの行動の結果を記録し、客観的に測定・評価する。" },
    { num: 5, title: "会う (Meet)", desc: "5ヶ月目: 自分が目指す場所にいる人、憧れの人に会いに行く、コミュニティに参加する。" },
    { num: 6, title: "出す (Output)", desc: "6ヶ月目: 学んだこと、経験したことを形にして外に出す。誰かのために使う。" }
  ];

  const app = document.getElementById('app');

  function saveContent(id, value) {
    localStorage.setItem('month_' + id, value);
    const statusEl = document.getElementById('status_' + id);
    statusEl.textContent = '保存しました';
    setTimeout(() => {
      statusEl.textContent = '';
    }, 2000);
  }

  months.forEach(month => {
    const savedContent = localStorage.getItem('month_' + month.num) || '';

    const card = document.createElement('div');
    card.className = 'month-card';

    card.innerHTML = `
      <div class="month-header">
        <div class="month-number">${month.num}</div>
        <div class="month-title">${month.num}ヶ月目：${month.title}</div>
      </div>
      <div class="month-desc">${month.desc}</div>
      <textarea
        id="textarea_${month.num}"
        placeholder="ここに${month.num}ヶ月目の目標や行動、気づきを書き込みましょう..."
      >${savedContent}</textarea>
      <div class="save-status" id="status_${month.num}"></div>
    `;

    app.appendChild(card);

    const textarea = document.getElementById('textarea_' + month.num);
    let timeoutId;

    textarea.addEventListener('input', (e) => {
      clearTimeout(timeoutId);
      const statusEl = document.getElementById('status_' + month.num);
      statusEl.textContent = '保存中...';

      timeoutId = setTimeout(() => {
        saveContent(month.num, e.target.value);
      }, 1000); // 1秒タイピングが止まったら自動保存
    });
  });
</script>

</body>
</html>
